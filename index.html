<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushaltsbuch</title>
<meta name="theme-color" content="#0f766e"><meta name="apple-mobile-web-app-title" content="Haushalt"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f6f3;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--ac:#0f766e;--ac2:#e3f1ef;--bd:#e3e3de;--bad:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151515;--card:#202020;--tx:#eeeeea;--mut:#9a9a94;--ac:#3fb5a8;--ac2:#1d3330;--bd:#333;--bad:#f97066;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151515;--card:#202020;--tx:#eeeeea;--mut:#9a9a94;--ac:#3fb5a8;--ac2:#1d3330;--bd:#333;--bad:#f97066;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:15px;margin:0 0 8px;color:var(--mut);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}.row>*{flex:1;min-width:0}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}
button{cursor:pointer;background:var(--ac);color:#fff;border:0;font-weight:600}
button.ghost{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.chip{padding:8px 12px;flex:0 0 auto;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.x{flex:0 0 auto;background:none;color:var(--mut);padding:4px 8px;font-size:18px}
.big{font-size:28px;font-weight:700}.mut{color:var(--mut);font-size:14px}.bad{color:var(--bad)}.ok{color:var(--ac)}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd)}.kv:last-child{border:0}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item .t{flex:1;min-width:0}.item .t small{display:block;color:var(--mut)}
.bar{height:8px;border-radius:6px;background:var(--bd);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;padding:12px 2px;font-size:12px}
nav button.on{color:var(--ac)}
.months{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.months button{flex:0 0 auto;padding:6px 14px}
#st{font-size:13px;color:var(--mut);margin-bottom:8px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
.sheet label{margin-top:6px;font-size:13px}
.sheet{max-height:85vh;overflow:auto}
.item .t{cursor:pointer}
body:not(.in) main,body:not(.in) nav{display:none}body.in #lg{display:none}#lg{max-width:360px;margin:60px auto}
</style></head>
<body><div id="lg" class="card"><h1>💰 Haushaltsbuch</h1>
<div class="row"><input id="le" type="email" placeholder="E-Mail" autocomplete="username"></div>
<div class="row"><input id="lp" type="password" placeholder="Passwort" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
<button style="width:100%" onclick="login()">Anmelden</button><div id="lm" class="mut bad" style="margin-top:8px"></div></div><main>
<h1>💰 Haushaltsbuch</h1>
<div id="st">Verbinde …</div>
<div id="app"></div>
<div id="mw"></div>
</main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur=n=>(+n||0).toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const pr=n=>(+n||0).toLocaleString("de-DE",{maximumFractionDigits:1});
const num=v=>{let s=String(v??"").trim().replace(/[\s€]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");const n=parseFloat(s);return isFinite(n)?n:0};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let db=null,cats=[],rec=[],exp=[],goals=[],S={incomes:[{name:"Einkommen 1",amount:0},{name:"Einkommen 2",amount:0}],pct:15},month=today().slice(0,7),tab="home",ready={};
const TABS=[["home","Übersicht"],["exp","Ausgaben"],["fix","Fixkosten"],["goal","Ziele"],["chart","Verlauf"],["set","Optionen"]];
const monthsLeft=d=>{if(!d)return 1;const[a,b]=d.split("-").map(Number),t=new Date();return Math.max(1,(a-t.getFullYear())*12+b-(t.getMonth()+1))};
const goalNeed=()=>goals.reduce((s,g)=>s+(g.date?Math.max(0,num(g.target)-num(g.saved))/monthsLeft(g.date):0),0);
const mLabel=m=>{const[y,mo]=m.split("-");return new Date(+y,mo-1,1).toLocaleDateString("de-DE",{month:"long",year:"numeric"})};
const shiftM=(m,d)=>{const[y,mo]=m.split("-").map(Number);const x=new Date(y,mo-1+d,1);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")};
const catName=id=>(cats.find(c=>c.id===id)||{}).name||"Ohne Kategorie";
const catOpts=()=>cats.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("");

function calc(){
  const income=incomeFor(month);
  const fix=rec.reduce((a,r)=>a+num(r.amount)/Math.max(1,num(r.interval)),0);
  const pct=num(S.pct),save=income*pct/100,consume=income-save,free=consume-fix;
  const mine=exp.filter(e=>(e.date||"").slice(0,7)===month),spent=mine.reduce((a,e)=>a+num(e.amount),0);
  return{income,fix,pct,save,consume,free,spent,left:free-spent,mine};
}
function shell(){
  $("#nav").innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  const T={
  home:`<div class="months"><button class="ghost" onclick="mv(-1)">‹</button><b id="ml"></b><button class="ghost" onclick="mv(1)">›</button></div>
   <div class="card"><h2>Sparziel</h2><div class="row" id="chips"></div>
   <div class="row"><input id="pct" inputmode="decimal" value="${esc(S.pct)}" oninput="setPct(this.value)"><span class="mut" style="flex:2">% vom Einkommen</span></div></div>
   <div class="card"><h2>Einnahmen im Monat</h2>${S.incomes.map((x,i)=>`<div class="row"><span style="flex:2">${esc(x.name)}</span><input inputmode="decimal" placeholder="${x.amount||0}" value="${(MD[month]||{}).inc&&MD[month].inc[i]!=null?MD[month].inc[i]:""}" onchange="setM('inc',${i},this.value)"></div>`).join("")}
   <div class="row"><span style="flex:2">Sonderzahlung</span><input inputmode="decimal" placeholder="0" value="${(MD[month]||{}).extra||""}" onchange="setM('extra',0,this.value)"></div><div class="mut">Leer lassen = Standardwert aus den Optionen.</div></div>
   <div id="sum"></div>
   <div id="fixc"></div>
   <div class="card"><h2>Tatsächlich gespart</h2><div class="row"><input id="svi" inputmode="decimal" placeholder="Betrag in €" value="${(MD[month]||{}).saved??""}" oninput="svDeb()" onchange="saveSv()"><button style="flex:0 0 auto" onclick="saveSv()">Speichern</button></div><div id="svs" class="mut"></div><div id="svr"></div></div>`,
  exp:`<div class="card"><h2>Neue Ausgabe</h2>
   <div class="row"><input id="ea" inputmode="decimal" placeholder="Betrag in €"><input id="ed" type="date" value="${today()}"></div>
   <div class="row"><select id="ec">${catOpts()}</select><input id="en" placeholder="Notiz (optional)"></div>
   <button style="width:100%" onclick="addExp()">Hinzufügen</button></div>
   <div class="months"><button class="ghost" onclick="mv(-1)">‹</button><b id="ml"></b><button class="ghost" onclick="mv(1)">›</button></div><div class="card" id="elist"></div>`,
  fix:`<div class="card"><h2>Wiederkehrende Ausgabe</h2>
   <div class="row"><input id="rn" placeholder="Name, z. B. Versicherung"><input id="ra" inputmode="decimal" placeholder="Betrag in €"></div>
   <div class="row"><select id="rc">${catOpts()}</select></div>
   <div class="row"><span class="mut" style="flex:0 0 auto">alle</span><input id="ri" inputmode="numeric" value="1" style="max-width:70px;flex:0 0 70px"><span class="mut" style="flex:0 0 auto">Monate</span>
   ${[1,3,6,12].map(n=>`<button class="chip" onclick="$('#ri').value=${n}">${n}</button>`).join("")}</div>
   <div class="row"><span class="mut" style="flex:2">Nächste Fälligkeit</span><input id="rs" type="month" value="${today().slice(0,7)}"></div>
   <button style="width:100%" onclick="addRec()">Hinzufügen</button></div><div class="card" id="rlist"></div><div class="card"><h2>Erwartet in den nächsten 12 Monaten</h2><div id="rfc"></div></div>`,
  chart:`<div class="months"><button class="ghost" onclick="mv(-1)">‹</button><span>bis <b id="ml"></b></span><button class="ghost" onclick="mv(1)">›</button></div>
   <div class="card"><h2>Ausgaben &amp; Gespartes pro Monat (€)</h2><div id="ch1"></div><div class="mut"><span style="color:#d97706">■</span> Ausgaben (variabel) &nbsp; <span class="ok">■</span> Tatsächlich gespart</div></div>
   <div class="card"><h2>Sparquote (%)</h2><div id="ch2"></div><div class="mut">Gestrichelt: dein Sparziel</div></div><div class="card" id="chs"></div>`,
  goal:`<div class="card"><h2>Neues Sparziel</h2>
   <div class="row"><input id="gn" placeholder="Name, z. B. Urlaub"><input id="gt" inputmode="decimal" placeholder="Zielbetrag €"></div>
   <div class="row"><input id="gs" inputmode="decimal" placeholder="Schon gespart €"><input id="gd" type="month"></div>
   <button style="width:100%" onclick="addGoal()">Anlegen</button></div><div id="glist"></div>`,
  set:`<div class="card"><h2>Standard-Einnahmen pro Monat (netto)</h2>${S.incomes.map((x,i)=>`<div class="row"><input value="${esc(x.name)}" onchange="setInc(${i},'name',this.value)"><input inputmode="decimal" value="${x.amount||""}" placeholder="€" onchange="setInc(${i},'amount',this.value)"></div>`).join("")}</div>
   <div class="card"><h2>Kategorien</h2><div class="row"><input id="cn" placeholder="Neue Kategorie"><button style="flex:0 0 auto" onclick="addCat()">+</button></div><div id="clist"></div></div>`};
  $("#app").innerHTML=T[tab];update();
}
function update(){
  if($("#ml"))$("#ml").textContent=mLabel(month);
  const c=calc();
  if(tab==="home"){
    const sv=(MD[month]||{}).saved,ov=c.income-c.fix-c.spent;
    const due=rec.filter(r=>dueIn(r,month)),dt=due.reduce((a,r)=>a+num(r.amount),0),nx=[1,2,3].map(i=>{const m=shiftM(month,i);return[m,rec.filter(r=>dueIn(r,m)).reduce((a,r)=>a+num(r.amount),0)]}),nod=rec.filter(r=>!r.start).length;
    $("#fixc").innerHTML=rec.length?`<div class="card"><h2>Fixkosten ${mLabel(month)}</h2>${due.length?due.map(r=>`<div class="kv"><span>${esc(r.name)}</span><span>${eur(r.amount)}</span></div>`).join("")+`<div class="kv"><b>Fällig in diesem Monat</b><b>${eur(dt)}</b></div>`:`<div class="mut">In diesem Monat ist nichts fällig.</div>`}<div class="kv"><span class="mut">Ø pro Monat (eingerechnet)</span><span>${eur(c.fix)}</span></div>${nx.map(([m,t])=>`<div class="kv"><span class="mut">Erwartet ${mLabel(m)}</span><span>${t?eur(t):"–"}</span></div>`).join("")}${nod?`<div class="mut" style="margin-top:6px">${nod} Fixkosten ohne Fälligkeit werden nicht gezeigt.</div>`:""}</div>`:"";
    $("#svr").innerHTML=(sv!=null?`<div class="big ${sv>=c.save?"ok":"bad"}">${pr(c.income?sv/c.income*100:0)} %</div><div class="mut">Ziel: ${pr(c.pct)} % (${eur(c.save)}) · ${sv>=c.save?"+":"−"}${eur(Math.abs(sv-c.save))}</div>`:"")+`<div class="mut" style="margin-top:6px">Rechnerisch übrig (Einnahmen − Fixkosten − Ausgaben): ${eur(ov)}</div>`;
    $("#chips").innerHTML=[10,15,20,25].map(p=>`<button class="chip ${c.pct===p?"on":""}" onclick="pick(${p})">${p} %</button>`).join("");
    const by={};c.mine.forEach(e=>by[e.cat]=(by[e.cat]||0)+num(e.amount));
    cats.forEach(x=>{if(num(x.budget)&&!(x.id in by))by[x.id]=0});
    const ix=k=>{const i=cats.findIndex(x=>x.id===k);return i<0?999:i};
    const rows=Object.entries(by).sort((a,b)=>ix(a[0])-ix(b[0]));
    $("#sum").innerHTML=`<div class="card"><h2>Bei ${c.pct} % Sparquote</h2>
     <div class="kv"><span>Einnahmen</span><b>${eur(c.income)}</b></div>
     <div class="kv"><span>💰 Sparen pro Monat</span><b class="ok">${eur(c.save)}</b></div>
     ${goals.length?`<div class="kv"><span class="mut">↳ davon für Ziele nötig</span><span>${eur(goalNeed())}</span></div>`:""}
     <div class="kv"><span>🛒 Konsumieren pro Monat</span><b>${eur(c.consume)}</b></div>
     <div class="kv"><span class="mut">davon Fixkosten (Ø pro Monat)</span><span>${eur(c.fix)}</span></div>
     <div class="kv"><span class="mut">davon frei für variable Ausgaben</span><span class="${c.free<0?"bad":""}">${eur(c.free)}</span></div></div>
     <div class="card"><h2>${mLabel(month)}</h2><div class="big ${c.left<0?"bad":"ok"}">${eur(c.left)}</div>
     <div class="mut">noch frei · ${eur(c.spent)} von ${eur(c.free)} ausgegeben</div>
     <div class="bar"><i style="width:${c.free>0?Math.min(100,c.spent/c.free*100):100}%;${c.left<0?"background:var(--bad)":""}"></i></div>
     ${rows.length?`<div style="margin-top:12px">${rows.map(([k,v])=>{const b=num((cats.find(x=>x.id===k)||{}).budget),pc=b?v/b*100:0;return `<div style="padding:6px 0;cursor:pointer" onclick="catHist('${k}')"><div class="kv" style="border:0;padding:0"><span>${esc(catName(k))}</span><span class="${b&&v>b?"bad":""}">${eur(v)}${b?" / "+eur(b):""}</span></div>${b?`<div class="bar"><i style="width:${Math.min(100,pc)}%;${pc>100?"background:var(--bad)":pc>80?"background:#d97706":""}"></i></div>`:""}</div>`}).join("")}</div>`:""}</div>`;
  }
  if(tab==="exp"){
    const l=c.mine.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    $("#elist").innerHTML=l.length?l.map(e=>`<div class="item"><div class="t" onclick="edit('expenses','${e.id}')">${esc(e.note||catName(e.cat))}<small>${esc(catName(e.cat))} · ${new Date(e.date).toLocaleDateString("de-DE")}</small></div><b>${eur(e.amount)}</b><button class="x" onclick="del('expenses','${e.id}')">×</button></div>`).join("")+`<div class="kv"><b>Summe</b><b>${eur(c.spent)}</b></div>`:`<span class="mut">Noch keine Ausgaben in diesem Monat.</span>`;
  }
  if(tab==="fix"){
    $("#rlist").innerHTML=rec.length?rec.map(r=>`<div class="item"><div class="t" onclick="edit('recurring','${r.id}')">${esc(r.name)}<small>${esc(catName(r.cat))} · alle ${r.interval} Monat${r.interval==1?"":"e"}${r.start?"":" · ⚠ Fälligkeit fehlt"} · Ø ${eur(num(r.amount)/Math.max(1,num(r.interval)))}/Monat</small></div><b>${eur(r.amount)}</b><button class="x" onclick="del('recurring','${r.id}')">×</button></div>`).join("")+`<div class="kv"><b>Ø pro Monat</b><b>${eur(c.fix)}</b></div>`:`<span class="mut">Noch keine Fixkosten angelegt.</span>`;
  }
  if(tab==="fix"){const nm=today().slice(0,7),miss=rec.filter(r=>!r.start).length;
    $("#rfc").innerHTML=rec.length?Array.from({length:12},(_,i)=>shiftM(nm,i)).map(m=>{const it=rec.filter(r=>dueIn(r,m)),t=it.reduce((a,r)=>a+num(r.amount),0);
      return it.length?`<details style="border-bottom:1px solid var(--bd);padding:8px 0"><summary style="display:flex;justify-content:space-between;cursor:pointer"><span>${mLabel(m)}</span><b>${eur(t)}</b></summary>${it.map(r=>`<div class="kv mut"><span>${esc(r.name)}</span><span>${eur(r.amount)}</span></div>`).join("")}</details>`:`<div class="kv"><span class="mut">${mLabel(m)}</span><span class="mut">–</span></div>`}).join("")+(miss?`<div class="mut" style="margin-top:8px">${miss} Fixkosten ohne Fälligkeit sind hier nicht enthalten. Tippe darauf und trage den Monat ein.</div>`:""):`<span class="mut">Noch keine Fixkosten.</span>`}
  if(tab==="chart"){const z=series();$("#ch1").innerHTML=bars(z);$("#ch2").innerHTML=rate(z);
    const ok=z.rt.filter(v=>v!=null);
    $("#chs").innerHTML=ok.length?`<div class="kv"><span>Ø Sparquote (Monate mit Eintrag)</span><b>${pr(ok.reduce((a,b)=>a+b,0)/ok.length)} %</b></div><div class="kv"><span>Gespart in diesen 12 Monaten</span><b>${eur(z.sv.reduce((a,b)=>a+num(b),0))}</b></div>`:`<span class="mut">${z.sv.some(x=>x!=null)?"Für die Sparquote fehlen noch Einnahmen in diesen Monaten (Übersicht oder Optionen).":"Trage in der Übersicht ein, wie viel du tatsächlich gespart hast. Dann erscheint hier die Sparquote."}</span>`}
  if(tab==="goal"){
    const need=goalNeed();
    $("#glist").innerHTML=(goals.length?`<div class="card"><div class="kv"><span>Für alle Ziele nötig</span><b>${eur(need)}/Monat</b></div><div class="kv"><span>Geplant zu sparen (${c.pct} %)</span><b class="${c.save>=need?"ok":"bad"}">${eur(c.save)}</b></div></div>`:"")+(goals.length?goals.map(g=>{const m=monthsLeft(g.date),rest=Math.max(0,num(g.target)-num(g.saved)),p=num(g.target)>0?Math.min(100,num(g.saved)/num(g.target)*100):0;
      return `<div class="card"><div class="item" style="border:0;padding:0"><div class="t" onclick="edit('goals','${g.id}')"><b>${esc(g.name)}</b><small>${g.date?"bis "+mLabel(g.date)+" · noch "+m+" Monat"+(m==1?"":"e"):"ohne Datum"}</small></div><button class="x" onclick="del('goals','${g.id}')">×</button></div><div class="kv"><span>${eur(g.saved)} von ${eur(g.target)}</span><b>${Math.round(p)} %</b></div><div class="bar"><i style="width:${p}%"></i></div><div class="row" style="margin-top:10px"><span class="mut" style="flex:2">${rest<=0?"🎉 Ziel erreicht":g.date?"Nötig: <b>"+eur(rest/m)+"</b> pro Monat":""}</span><button class="ghost" onclick="edit('deposit','${g.id}')">+ Einzahlen</button></div></div>`}).join(""):`<span class="mut">Noch keine Ziele.</span>`);
  }
  if(tab==="set"){
    $("#clist").innerHTML=(cats.length?cats.map((x,i)=>`<div class="item"><div class="t" onclick="edit('categories','${x.id}')">${esc(x.name)}${x.budget?`<small>Budget ${eur(x.budget)} pro Monat</small>`:""}</div><button class="x" onclick="moveCat(${i},-1)">▲</button><button class="x" onclick="moveCat(${i},1)">▼</button><button class="x" onclick="catHist('${x.id}')">📊</button><button class="x" onclick="del('categories','${x.id}')">×</button></div>`).join(""):"")+
    (cats.length?"":`<button class="ghost" style="width:100%" onclick="seedCats()">Standardkategorien anlegen</button>`);
  }
}
function addGoal(){const n=$("#gn").value.trim(),t=num($("#gt").value);if(!n||!t)return;
  db.collection("goals").add({name:n,target:t,saved:num($("#gs").value),date:$("#gd").value||""}).catch(err);
  ["#gn","#gt","#gs","#gd"].forEach(k=>$(k).value="")}
const F={expenses:[["amount","Betrag €","n"],["date","Datum","date"],["cat","Kategorie","cat"],["note","Notiz","t"]],
 recurring:[["name","Name","t"],["amount","Betrag €","n"],["cat","Kategorie","cat"],["interval","Alle … Monate","i"],["start","Nächste Fälligkeit","month"]],
 goals:[["name","Name","t"],["target","Zielbetrag €","n"],["saved","Bereits gespart €","n"],["date","Zieldatum","month"]],
 categories:[["name","Name","t"],["budget","Monatsbudget € (optional, zur Orientierung)","n"]],
 deposit:[["add","Betrag einzahlen € (negativ = entnehmen)","n"]]};
let M=null;
function edit(col,id){
  const o=({expenses:exp,recurring:rec,goals:goals,categories:cats,deposit:goals})[col].find(x=>x.id===id);if(!o)return;M={col,id,o};
  const h=F[col].map(([k,l,t])=>{const v=col==="deposit"?"":(o[k]??"");
